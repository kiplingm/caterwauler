<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Songbook</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg: #1c1420;
    --bg-raised: #241a2b;
    --line: #3a2c42;
    --gold: #e8b74e;
    --teal: #3ddad7;
    --cream: #f2e9dc;
    --cream-dim: #b6a99a;
    --red: #e8615a;
    --green: #6fbf73;
  }
  body[data-theme="rust"]{
    --bg: #1a1512;
    --bg-raised: #241b16;
    --line: #40302a;
    --gold: #c9722f;
    --teal: #7fa66b;
    --cream: #f0e6d6;
    --cream-dim: #b3a48c;
    --red: #cc5c4a;
    --green: #8fae5f;
  }
  body[data-theme="cassette"]{
    --bg: #141a2e;
    --bg-raised: #1d2740;
    --line: #2e3b5c;
    --gold: #ff5da2;
    --teal: #4fd3ff;
    --cream: #eef1fb;
    --cream-dim: #9aa6c9;
    --red: #ff5d5d;
    --green: #52e0a1;
  }
  body[data-theme="contrast"]{
    --bg: #000000;
    --bg-raised: #0d0d0d;
    --line: #ffffff;
    --gold: #ffe600;
    --teal: #00e5ff;
    --cream: #ffffff;
    --cream-dim: #dddddd;
    --red: #ff453a;
    --green: #30ff5e;
  }
  body[data-theme="contrast"] .card,
  body[data-theme="contrast"] input,
  body[data-theme="contrast"] select,
  body[data-theme="contrast"] .range-track,
  body[data-theme="contrast"] .chip,
  body[data-theme="contrast"] .gear-btn{
    border-width:2px;
  }
  body[data-theme="contrast"] .card-actions button{
    border-width:2px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--cream);font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent;}
  body{padding-bottom:88px;}

  .top-bar{
    position:sticky; top:0; background:var(--bg); z-index:20;
    box-shadow:0 6px 10px -6px rgba(0,0,0,0.35);
  }
  .marquee{
    padding:22px 18px 14px;
  }
  .marquee h1{
    font-family:'Bebas Neue',sans-serif;
    font-size:34px;
    letter-spacing:1.5px;
    margin:0;
    color:var(--gold);
    text-shadow:0 0 18px rgba(232,183,78,0.35);
  }
  .marquee-top{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .gear-btn{
    flex:none; background:var(--bg-raised); border:1px solid var(--line); border-radius:10px;
    width:38px; height:38px; font-size:18px; color:var(--cream-dim); line-height:1;
  }
  .gear-btn:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible{
    outline:2px solid var(--teal); outline-offset:2px;
  }
  .marquee .sub{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--cream-dim);
    margin-top:4px;
    letter-spacing:0.5px;
  }

  .controls{padding:14px 18px 4px; display:flex; flex-direction:column; gap:10px;}
  .search-row{display:flex; gap:8px;}
  input[type=text]{
    flex:1; background:var(--bg-raised); border:1px solid var(--line); border-radius:10px;
    padding:11px 12px; color:var(--cream); font-size:15px; font-family:'Inter',sans-serif;
  }
  input[type=text]:focus{outline:none; border-color:var(--teal);}
  .sort-select{
    flex:none; background:var(--bg-raised); border:1px solid var(--line); border-radius:10px;
    padding:11px 8px; color:var(--cream-dim); font-size:12.5px; font-family:'IBM Plex Mono',monospace;
    max-width:112px;
  }
  .sort-select:focus{outline:none; border-color:var(--teal);}
  .filter-chips{display:flex; gap:6px; overflow-x:auto; padding-bottom:2px;}
  .chip{
    flex:none; font-family:'IBM Plex Mono',monospace; font-size:11.5px; letter-spacing:0.3px;
    padding:6px 12px; border-radius:999px; border:1px solid var(--line); color:var(--cream-dim);
    background:transparent; white-space:nowrap;
  }
  .chip.active{border-color:var(--gold); color:var(--gold); background:rgba(232,183,78,0.08);}

  .count-row{padding:10px 18px 10px; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--cream-dim); border-bottom:1px solid var(--line);}

  .list{padding:8px 14px 20px; display:flex; flex-direction:column; gap:10px;}
  .card{
    background:var(--bg-raised); border:1px solid var(--line); border-radius:14px; padding:14px 14px 12px;
  }
  .card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .title{font-weight:700; font-size:16px; line-height:1.25;}
  .artist{font-size:13px; color:var(--cream-dim); margin-top:2px;}
  .status-pill{
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.4px;
    padding:4px 9px; border-radius:999px; flex:none; text-transform:uppercase;
  }
  .status-Solid{background:rgba(111,191,115,0.15); color:var(--green);}
  .status-Learning{background:rgba(61,218,215,0.15); color:var(--teal);}
  .status-Maybe{background:rgba(232,183,78,0.15); color:var(--gold);}
  .status-Retired{background:rgba(232,97,90,0.15); color:var(--red);}
  .status-Suggested{background:rgba(182,169,154,0.18); color:var(--cream-dim);}
  .status-pill{cursor:pointer;}
  .status-edit-select{
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.4px;
    padding:4px 6px; border-radius:999px; flex:none; text-transform:uppercase;
    background:var(--bg); color:var(--cream); border:1px solid var(--teal);
  }
  .range-fit.fit-out .transpose-suggestion{
    display:block; margin-top:3px; color:var(--teal);
  }

  .range-strip{margin-top:12px;}
  .range-track{
    position:relative; height:10px; border-radius:6px; background:var(--bg);
    border:1px solid var(--line);
  }
  .range-comfort{position:absolute; top:0; bottom:0; background:rgba(61,218,215,0.18); border-left:1px solid var(--teal); border-right:1px solid var(--teal);}
  .range-song{position:absolute; top:-3px; height:16px; border-radius:5px; background:linear-gradient(90deg, var(--gold), #f2d38a); box-shadow:0 0 8px rgba(232,183,78,0.5);}
  .range-labels{display:flex; justify-content:space-between; font-family:'IBM Plex Mono',monospace; font-size:9.5px; color:var(--cream-dim); margin-top:5px;}
  .range-fit{font-family:'IBM Plex Mono',monospace; font-size:10px; margin-top:4px;}
  .fit-easy{color:var(--green);} .fit-stretch{color:var(--gold);} .fit-out{color:var(--red);} .fit-unknown{color:var(--cream-dim);}

  .card-meta{display:flex; gap:14px; margin-top:10px; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--cream-dim);}
  .card-actions{display:flex; gap:8px; margin-top:12px;}
  .spotify-link{
    display:flex; align-items:center; justify-content:center; gap:6px;
    width:100%; margin-top:12px; padding:9px 0; border-radius:9px;
    border:1px solid var(--green); color:var(--green); text-decoration:none;
    font-family:'Inter',sans-serif; font-size:12.5px; font-weight:600;
  }
  .card-actions button{
    flex:1; font-family:'Inter',sans-serif; font-size:12.5px; font-weight:600;
    padding:8px 0; border-radius:8px; border:1px solid var(--line); background:transparent; color:var(--cream-dim);
  }
  .card-actions button.primary{border-color:var(--teal); color:var(--teal);}
  .card-actions button.danger{border-color:var(--red); color:var(--red);}

  .fab{
    position:fixed; right:20px; bottom:24px; width:56px; height:56px; border-radius:50%;
    background:var(--gold); color:#1c1420; font-size:28px; border:none; box-shadow:0 6px 20px rgba(232,183,78,0.4);
    display:flex; align-items:center; justify-content:center; z-index:30;
  }

  .sheet-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:40; display:none;
  }
  .sheet-backdrop.open{display:block;}
  .sheet{
    position:fixed; left:0; right:0; bottom:0; background:var(--bg-raised); border-top:1px solid var(--line);
    border-radius:18px 18px 0 0; padding:18px 18px 22px; z-index:41;
    transform:translateY(100%); transition:transform 0.25s ease; max-height:85vh; overflow-y:auto;
  }
  .sheet.open{transform:translateY(0);}
  .sheet h2{font-family:'Bebas Neue',sans-serif; font-size:22px; color:var(--gold); margin:0 0 14px; letter-spacing:1px;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--cream-dim); margin-bottom:5px; letter-spacing:0.4px;}
  .field input, .field select{
    width:100%; background:var(--bg); border:1px solid var(--line); border-radius:9px; padding:10px 11px;
    color:var(--cream); font-size:14.5px; font-family:'Inter',sans-serif;
  }
  .field-row{display:flex; gap:10px;}
  .field-row .field{flex:1;}

  .autocomplete-field{position:relative;}
  .autocomplete-list{
    position:absolute; left:0; right:0; top:100%; margin-top:4px;
    background:var(--bg-raised); border:1px solid var(--line); border-radius:10px;
    max-height:220px; overflow-y:auto; z-index:60; display:none;
  }
  .autocomplete-list.open{display:block;}
  .autocomplete-item{
    padding:10px 12px; border-bottom:1px solid var(--line); cursor:pointer;
  }
  .autocomplete-item:last-child{border-bottom:none;}
  .autocomplete-item .ac-title{font-size:13.5px; color:var(--cream); font-weight:600;}
  .autocomplete-item .ac-artist{font-size:11.5px; color:var(--cream-dim); margin-top:1px;}
  .autocomplete-empty{
    padding:10px 12px; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--cream-dim);
  }
  .ac-group-label{
    padding:7px 12px 3px; font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:0.6px;
    color:var(--cream-dim); text-transform:uppercase; opacity:0.8;
  }

  .log-history{margin-bottom:14px;}
  .log-history-title{
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.5px;
    color:var(--cream-dim); text-transform:uppercase; margin-bottom:8px;
  }
  .log-history-empty{
    font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--cream-dim); padding:2px 0 4px;
  }
  .log-history-list{display:flex; flex-direction:column; gap:8px; max-height:220px; overflow-y:auto; margin-bottom:2px;}
  .log-history-item{background:var(--bg-raised); border:1px solid var(--line); border-radius:10px; padding:10px 12px;}
  .log-history-top{display:flex; justify-content:space-between; align-items:baseline; gap:8px;}
  .log-history-date{font-weight:700; font-size:13px;}
  .log-history-crowd{font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--cream-dim); flex:none;}
  .log-history-venue{font-size:12.5px; color:var(--cream-dim); margin-top:2px;}
  .log-history-notes{font-size:12px; color:var(--cream-dim); margin-top:4px; font-style:italic;}
  .log-history-actions{display:flex; gap:8px; margin-top:8px;}
  .log-history-actions button{
    flex:1; font-family:'Inter',sans-serif; font-size:11.5px; font-weight:600;
    padding:6px 0; border-radius:7px; border:1px solid var(--line); background:transparent; color:var(--cream-dim);
  }
  .log-history-actions button.danger{border-color:var(--red); color:var(--red);}
  .log-editing-banner{
    display:flex; justify-content:space-between; align-items:center; gap:8px;
    background:rgba(232,183,78,0.1); border:1px solid var(--gold); border-radius:10px;
    padding:8px 12px; margin-bottom:14px; font-size:12px; color:var(--gold);
  }
  .log-editing-banner button{
    background:transparent; border:none; color:var(--gold); font-weight:700; font-size:11.5px;
    text-decoration:underline; padding:0; flex:none;
  }
  .sheet-actions{display:flex; gap:10px; margin-top:16px;}
  .sheet-actions button{flex:1; padding:12px 0; border-radius:10px; font-weight:700; font-size:14px; border:none;}
  .btn-save{background:var(--gold); color:#1c1420;}
  .btn-cancel{background:transparent; border:1px solid var(--line) !important; color:var(--cream-dim);}
  .btn-delete-song{
    width:100%; margin-top:10px; padding:11px 0; border-radius:10px; border:1px solid var(--red);
    background:transparent; color:var(--red); font-family:'Inter',sans-serif; font-size:13.5px; font-weight:600;
  }

  .toast{
    position:fixed; bottom:96px; left:50%; transform:translateX(-50%);
    background:var(--bg-raised); border:1px solid var(--teal); color:var(--teal);
    padding:9px 16px; border-radius:999px; font-family:'IBM Plex Mono',monospace; font-size:12px;
    z-index:50; opacity:0; transition:opacity 0.2s;
  }
  .toast.show{opacity:1;}

  .empty{padding:40px 20px; text-align:center; color:var(--cream-dim); font-family:'IBM Plex Mono',monospace; font-size:12.5px;}
  .loading{padding:40px 20px; text-align:center; color:var(--cream-dim); font-family:'IBM Plex Mono',monospace; font-size:12px;}

  .theme-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .theme-option{
    display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:10px;
    border:1px solid var(--line); background:var(--bg); text-align:left;
  }
  .theme-option.active{border-color:var(--teal); box-shadow:0 0 0 1px var(--teal) inset;}
  .theme-swatch{
    flex:none; width:26px; height:26px; border-radius:8px; border:1px solid rgba(255,255,255,0.15);
    display:grid; grid-template-columns:1fr 1fr; overflow:hidden;
  }
  .theme-swatch span{display:block;}
  .theme-name{font-family:'Inter',sans-serif; font-size:12.5px; font-weight:600; color:var(--cream);}
  .theme-tag{display:block; font-family:'IBM Plex Mono',monospace; font-size:9.5px; color:var(--cream-dim); margin-top:1px;}

  .check-missing-btn{
    width:100%; padding:11px 0; border-radius:10px; border:1px solid var(--line);
    background:var(--bg); color:var(--cream); font-family:'Inter',sans-serif; font-size:13.5px; font-weight:600;
  }
  #missingResults{margin-top:12px;}
  .missing-summary{
    font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--cream-dim); margin-bottom:8px;
  }
  .missing-item{
    padding:9px 11px; border:1px solid var(--line); border-radius:9px; margin-bottom:6px;
    background:var(--bg-raised); cursor:pointer;
  }
  .missing-item .mi-title{font-size:13px; font-weight:600; color:var(--cream);}
  .missing-item .mi-artist{font-size:11.5px; color:var(--cream-dim); margin-top:1px;}
  .missing-none{
    font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--green);
    padding:10px 0;
  }
  .missing-hint{
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--cream-dim);
    margin-top:8px; line-height:1.5;
  }
</style>
</head>
<body>

<div class="top-bar">
  <div class="marquee">
    <div class="marquee-top">
      <h1>SONGBOOK</h1>
      <button class="gear-btn" id="settingsBtn" aria-label="Settings">⚙</button>
    </div>
    <div class="sub" id="rangeLine">YOUR RANGE — LOADING…</div>
  </div>

  <div class="controls">
    <div class="search-row">
      <input type="text" id="search" placeholder="Search title or artist…">
      <select id="sortSelect" class="sort-select">
        <option value="fit">Best fit</option>
        <option value="title">Title</option>
        <option value="lastPlayed">Last played</option>
      </select>
    </div>
    <div class="filter-chips" id="chips"></div>
  </div>

  <div class="count-row" id="countRow"></div>
</div>
<div class="list" id="list"><div class="loading">Loading songbook…</div></div>

<button class="fab" id="fabAdd">+</button>

<div class="sheet-backdrop" id="backdrop"></div>
<div class="sheet" id="sheet">
  <h2 id="sheetTitle">Add song</h2>
  <input type="hidden" id="editId">
  <div class="field autocomplete-field">
    <label>TITLE</label>
    <input type="text" id="fTitle" placeholder="Song title" autocomplete="off">
    <div class="autocomplete-list" id="titleSuggestions"></div>
  </div>
  <div class="field autocomplete-field">
    <label>ARTIST</label>
    <input type="text" id="fArtist" placeholder="Artist" autocomplete="off">
    <div class="autocomplete-list" id="artistSuggestions"></div>
  </div>
  <div class="field-row">
    <div class="field">
      <label>LOW NOTE</label>
      <input type="text" id="fLow" placeholder="e.g. C3">
    </div>
    <div class="field">
      <label>HIGH NOTE</label>
      <input type="text" id="fHigh" placeholder="e.g. F4">
    </div>
  </div>
  <div class="field-row">
    <div class="field">
      <label>STATUS</label>
      <select id="fStatus">
        <option>Solid</option>
        <option>Learning</option>
        <option selected>Maybe</option>
        <option>Suggested</option>
        <option>Retired</option>
      </select>
    </div>
    <div class="field">
      <label>GENRE</label>
      <input type="text" id="fGenre" placeholder="e.g. Heartland rock">
    </div>
  </div>
  <div class="field">
    <label>KEY NOTES</label>
    <input type="text" id="fKeyNotes" placeholder="Capo, key changes, phrasing notes…">
  </div>
  <div class="sheet-actions">
    <button class="btn-cancel" id="btnCancel">Cancel</button>
    <button class="btn-save" id="btnSave">Save</button>
  </div>
  <button class="btn-delete-song" id="btnDeleteSong" style="display:none;">Delete song</button>
</div>

<div class="sheet-backdrop" id="logBackdrop"></div>
<div class="sheet" id="logSheet">
  <h2 id="logSheetTitle">Log performance</h2>
  <div id="logSongLabel" class="artist" style="margin-bottom:12px;"></div>
  <input type="hidden" id="logSongId">
  <input type="hidden" id="logEntryId">

  <div class="log-history" id="logHistory"></div>

  <div class="log-editing-banner" id="logEditingBanner" style="display:none;">
    <span id="logEditingText">Editing entry</span>
    <button type="button" id="btnCancelEditEntry">Cancel edit</button>
  </div>

  <div class="field">
    <label>DATE</label>
    <input type="date" id="lDate">
  </div>
  <div class="field autocomplete-field">
    <label>VENUE</label>
    <input type="text" id="lVenue" placeholder="e.g. The Swiss" autocomplete="off">
    <div class="autocomplete-list" id="venueSuggestions"></div>
  </div>
  <div class="field">
    <label>CROWD RESPONSE</label>
    <select id="lCrowd">
      <option value="">—</option>
      <option>Killed it</option>
      <option>Solid</option>
      <option>Mixed</option>
      <option>Rough</option>
    </select>
  </div>
  <div class="field">
    <label>NOTES</label>
    <input type="text" id="lNotes" placeholder="Anything worth remembering…">
  </div>
  <div class="sheet-actions">
    <button class="btn-cancel" id="btnLogCancel">Cancel</button>
    <button class="btn-save" id="btnLogSave">Save</button>
  </div>
</div>

<div class="sheet-backdrop" id="settingsBackdrop"></div>
<div class="sheet" id="settingsSheet">
  <h2>Settings</h2>
  <div class="field">
    <label>COLOR SCHEME</label>
    <div class="theme-grid" id="themeGrid"></div>
  </div>
  <div class="field">
    <label>DATA HEALTH</label>
    <button class="check-missing-btn" id="checkMissingBtn">Check for missing range data</button>
    <div id="missingResults"></div>
  </div>
  <div class="sheet-actions">
    <button class="btn-cancel" id="btnSettingsClose" style="flex:1;">Done</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = "https://luykkuptcizkdigwness.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx1eWtrdXB0Y2l6a2RpZ3duZXNzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4MTcyOTgsImV4cCI6MjEwMDM5MzI5OH0.IWrRp9mzUYOXJmd17-7_M6pnz3rw3LX5xMpnkXlolRw";
const HEADERS = {
  "apikey": SUPABASE_KEY,
  "Authorization": "Bearer " + SUPABASE_KEY,
  "Content-Type": "application/json"
};

// Kipling's vocal range
const COMFORT_LOW = "A2", COMFORT_HIGH = "B4";
const STRETCH_LOW = "G2", STRETCH_HIGH = "D5";

const NOTE_VALUES = {C:0,"C#":1,DB:1,D:2,"D#":3,EB:3,E:4,F:5,"F#":6,GB:6,G:7,"G#":8,AB:8,A:9,"A#":10,BB:10,B:11};

function noteToSemitone(note){
  if(!note) return null;
  const m = note.trim().toUpperCase().match(/^([A-G])(#|B)?(-?\d)$/);
  if(!m) return null;
  let [, letter, acc, octave] = m;
  let key = letter + (acc || "");
  if(!(key in NOTE_VALUES)) return null;
  return NOTE_VALUES[key] + (parseInt(octave)+1)*12;
}

const comfortLowS = noteToSemitone(COMFORT_LOW);
const comfortHighS = noteToSemitone(COMFORT_HIGH);
const stretchLowS = noteToSemitone(STRETCH_LOW);
const stretchHighS = noteToSemitone(STRETCH_HIGH);

async function fetchSongs(){

      `${SUPABASE_URL}/rest/v1/songs?select=*,performances(performance_date)&order=title.asc`,
      {headers: HEADERS}
    );

        .map(p => p.performance_date)
        .filter(Boolean)
        .sort();
      return {

      };
    });

function fitLabel(lowS, highS){
  if(lowS===null || highS===null) return {cls:"fit-unknown", text:"RANGE NOT SET"};
  if(lowS >= comfortLowS && highS <= comfortHighS) return {cls:"fit-easy", text:"EASY FIT"};
  if(lowS >= stretchLowS && highS <= stretchHighS) return {cls:"fit-stretch", text:"STRETCH"};
  return {cls:"fit-out", text:"OUT OF RANGE"};
}

// Lower score = better fit against comfort zone. Unknown ranges sort last.
function fitScore(low, high){
  const lowS = noteToSemitone(low), highS = noteToSemitone(high);
  if(lowS===null || highS===null) return Infinity;
  const below = Math.max(0, comfortLowS - lowS);
  const above = Math.max(0, highS - comfortHighS);
  return below + above;
}

const NOTE_NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
function semitoneToNoteName(s){
  const pc = ((s % 12) + 12) % 12;
  const octave = Math.floor(s / 12) - 1;
  return NOTE_NAMES[pc] + octave;
}

// For an out-of-range song, suggest a semitone shift that best fits it into
// the comfort zone (or failing that, the stretch zone).
function suggestTransposition(lowS, highS){
  if(lowS===null || highS===null) return null;
  const songSpan = highS - lowS;
  const comfortSpan = comfortHighS - comfortLowS;

  if(songSpan <= comfortSpan){
    const minShift = comfortLowS - lowS;
    const maxShift = comfortHighS - highS;
    const shift = Math.round((minShift + maxShift) / 2);
    return {shift, zone: "comfort"};
  }
  const stretchSpan = stretchHighS - stretchLowS;
  if(songSpan <= stretchSpan){
    const minShift = stretchLowS - lowS;
    const maxShift = stretchHighS - highS;
    const shift = Math.round((minShift + maxShift) / 2);
    return {shift, zone: "stretch"};
  }
  return {shift: 0, zone: "none"};
}

function transpositionMessage(lowS, highS){
  const suggestion = suggestTransposition(lowS, highS);
  if(!suggestion) return "";
  const {shift, zone} = suggestion;
  if(zone === "none"){
    return "Spans more than your full range — no single key change fixes this one.";
  }
  const dir = shift > 0 ? "up" : shift < 0 ? "down" : null;
  const zoneLabel = zone === "comfort" ? "an easy fit" : "your stretch range";
  if(!dir){
    return `Already centered — this is as good as it gets in ${zoneLabel}.`;
  }
  const newLow = semitoneToNoteName(lowS + shift);
  const newHigh = semitoneToNoteName(highS + shift);
  return `Try shifting ${dir} ${Math.abs(shift)} semitone${Math.abs(shift)===1?"":"s"} (${newLow}–${newHigh}) for ${zoneLabel}.`;
}

function renderRangeStrip(low, high){
  const lowS = noteToSemitone(low), highS = noteToSemitone(high);
  const spanLow = stretchLowS - 2, spanHigh = stretchHighS + 2;
  const span = spanHigh - spanLow;
  const pct = v => Math.max(0, Math.min(100, ((v - spanLow)/span)*100));

  const comfortLeft = pct(comfortLowS), comfortRight = pct(comfortHighS);
  let songBar = "";
  if(lowS!==null && highS!==null){
    const l = pct(lowS), r = pct(highS);
    const width = Math.max(r-l, 2.5);
    songBar = `<div class="range-song" style="left:${l}%; width:${width}%;"></div>`;
  }
  const fit = fitLabel(lowS, highS);
  const suggestionHtml = fit.cls === "fit-out"
    ? `<span class="transpose-suggestion">${transpositionMessage(lowS, highS)}</span>`
    : "";
  return `
    <div class="range-strip">
      <div class="range-track">
        <div class="range-comfort" style="left:${comfortLeft}%; width:${comfortRight-comfortLeft}%;"></div>
        ${songBar}
      </div>
      <div class="range-labels"><span>${STRETCH_LOW}</span><span>${STRETCH_HIGH}</span></div>
      <div class="range-fit ${fit.cls}">${fit.text}${lowS!==null&&highS!==null ? ` · ${low}–${high}` : ""}${suggestionHtml}</div>
    </div>`;
}

function render(){
  let filtered = songs.filter(s=>{
    const matchesFilter = activeFilter==="All" || s.status===activeFilter;
    const matchesSearch = !searchTerm || (s.title||"").toLowerCase().includes(searchTerm) || (s.artist||"").toLowerCase().includes(searchTerm);
    return matchesFilter && matchesSearch;
  });

  filtered = filtered.slice().sort((a,b)=>{
    if(sortMode === "title"){
      return (a.title||"").localeCompare(b.title||"");
    }
    if(sortMode === "lastPlayed"){
      // Most recently played first; never-played songs sort last.
      if(!a.last_played && !b.last_played) return (a.title||"").localeCompare(b.title||"");
      if(!a.last_played) return 1;
      if(!b.last_played) return -1;
      return b.last_played.localeCompare(a.last_played);
    }
    // fit: best range match first, tie-broken by title
    if(a.fit_score !== b.fit_score) return a.fit_score - b.fit_score;
    return (a.title||"").localeCompare(b.title||"");
  });

  countRow.textContent = `${filtered.length} of ${songs.length} songs`;

  if(filtered.length===0){
    listEl.innerHTML = `<div class="empty">No songs match. Try a different search or filter — or add one with the + button.</div>`;
    return;
  }

  listEl.innerHTML = filtered.map(s => `
    <div class="card" data-id="${s.id}">
      <div class="card-top">
        <div>
          <div class="title">${escapeHtml(s.title)}</div>
          <div class="artist">${escapeHtml(s.artist)}</div>
        </div>
        ${editingStatusId === s.id ? `
          <select class="status-edit-select" data-id="${s.id}">
            ${STATUS_OPTIONS.map(opt => `<option value="${opt}" ${opt===s.status?"selected":""}>${opt}</option>`).join("")}
          </select>
        ` : `
          <div class="status-pill status-${s.status}" data-id="${s.id}">${s.status}</div>
        `}
      </div>
      ${renderRangeStrip(s.low_note, s.high_note)}
      <div class="card-meta">
        ${s.genre ? `<span>${escapeHtml(s.genre)}</span>` : ""}
        ${s.last_played ? `<span>Last played ${formatDate(s.last_played)}</span>` : ""}
        ${s.key_notes ? `<span>${escapeHtml(s.key_notes)}</span>` : ""}
      </div>
      <a class="spotify-link" href="https://open.spotify.com/search/${encodeURIComponent(s.title + ' ' + s.artist)}" target="_blank" rel="noopener">
        ♪ Find on Spotify
      </a>
      <div class="card-actions">
        <button class="logBtn primary" data-id="${s.id}">Log</button>
        <button class="editBtn" data-id="${s.id}">Edit</button>
        <button class="delBtn danger" data-id="${s.id}">Delete</button>
      </div>
    </div>
  `).join("");

  document.querySelectorAll(".status-pill").forEach(el=>{
    el.onclick = () => { editingStatusId = el.dataset.id; render(); };
  });
  document.querySelectorAll(".status-edit-select").forEach(sel=>{
    sel.onchange = () => updateStatus(sel.dataset.id, sel.value);
    sel.onblur = () => { editingStatusId = null; render(); };
    setTimeout(()=>sel.focus(), 0);
  });
  document.querySelectorAll(".logBtn").forEach(b=>b.onclick = ()=>openLog(b.dataset.id));
  document.querySelectorAll(".editBtn").forEach(b=>b.onclick = ()=>openEdit(b.dataset.id));
  document.querySelectorAll(".delBtn").forEach(b=>b.onclick = ()=>deleteSong(b.dataset.id));
}

// --- Venue autocomplete: previous venues you've logged, then real-world places ---
let venueHistory = null;
let venueDebounce = null;

async function loadVenueHistory(){
  if(venueHistory) return venueHistory;
  try{
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/performances?select=venue,performance_date&venue=not.is.null&order=performance_date.desc&limit=500`,
      {headers: HEADERS}
    );
    if(!res.ok) throw new Error();
    const rows = await res.json();
    const seen = new Set();
    venueHistory = [];
    rows.forEach(r=>{
      const v = (r.venue || "").trim();
      const key = v.toLowerCase();
      if(v && !seen.has(key)){ seen.add(key); venueHistory.push(v); }
    });
  }catch(e){
    venueHistory = [];
  }
  return venueHistory;
}

async function queryPhoton(q, useBias){
  const bias = useBias ? `&lat=47.2529&lon=-122.4443` : "";
  const url = `https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&limit=6${bias}`;
  const res = await fetch(url);
  if(!res.ok) return [];
  const data = await res.json();
  return (data.features || []).map(f=>{
    const p = f.properties || {};
    const locality = [p.city || p.county, p.state].filter(Boolean).join(", ");
    return {label: p.name || p.street || "", sub: locality};
  }).filter(p => p.label);
}

async function queryNominatim(q){
  const url = `https://nominatim.openstreetmap.org/search?format=jsonv2&q=${encodeURIComponent(q)}&limit=6&viewbox=-122.62,47.34,-122.34,47.14&bounded=0`;
  const res = await fetch(url);
  if(!res.ok) return [];
  const data = await res.json();
  return (data || []).map(r => ({
    label: (r.display_name || "").split(",")[0].trim(),
    sub: (r.display_name || "").split(",").slice(1, 3).join(",").trim()
  })).filter(p => p.label);
}

async function searchPlaces(query){
  const q = query.trim();
  let results = [];
  try{ results = await queryPhoton(q, true); }catch(e){}
  if(results.length === 0){
    try{ results = await queryPhoton(q, false); }catch(e){}
  }
  // If a multi-word query with a leading word (e.g. an informal nickname like "Jim's")
  // comes up empty, retry against just the trailing words.
  const words = q.split(/\s+/);
  if(results.length === 0 && words.length > 1){
    try{ results = await queryPhoton(words.slice(1).join(" "), false); }catch(e){}
  }
  if(results.length === 0){
    try{ results = await queryNominatim(q); }catch(e){}
  }
  return results;
}

async function searchVenues(query){
  const q = query.trim().toLowerCase();
  const history = await loadVenueHistory();
  const previous = history.filter(v => v.toLowerCase().includes(q)).slice(0, 5);

  let places = [];
  if(query.trim().length >= 3){
    try{
      const raw = await searchPlaces(query);
      places = raw.filter(p => !previous.some(v=>v.toLowerCase()===p.label.toLowerCase()));
      // De-dupe by label since Nominatim can return near-duplicate rows
      const seen = new Set();
      places = places.filter(p=>{
        const key = p.label.toLowerCase();
        if(seen.has(key)) return false;
        seen.add(key);
        return true;
      }).slice(0, 5);
    }catch(e){
      // No network access or providers unreachable — fall back to previous-venue matches only
    }
  }
  return {previous, places};
}

function renderVenueSuggestions({previous, places}){
  const list = document.getElementById("venueSuggestions");
  if(previous.length === 0 && places.length === 0){
    list.innerHTML = `<div class="autocomplete-empty">No matches — keep typing, or enter a new venue</div>`;
    list.classList.add("open");
    return;
  }
  let html = "";
  if(previous.length){
    html += `<div class="ac-group-label">Previous venues</div>`;
    html += previous.map(v => `
      <div class="autocomplete-item venue-item" data-value="${escapeHtml(v)}">
        <div class="ac-title">${escapeHtml(v)}</div>
      </div>
    `).join("");
  }
  if(places.length){
    html += `<div class="ac-group-label">Places</div>`;
    html += places.map(p => `
      <div class="autocomplete-item venue-item" data-value="${escapeHtml(p.label)}">
        <div class="ac-title">${escapeHtml(p.label)}</div>
        ${p.sub ? `<div class="ac-artist">${escapeHtml(p.sub)}</div>` : ""}
      </div>
    `).join("");
  }
  list.innerHTML = html;
  list.querySelectorAll(".venue-item").forEach(el=>{
    el.onclick = () => {
      document.getElementById("lVenue").value = el.dataset.value;
      list.classList.remove("open");
    };
  });
  list.classList.add("open");
}

document.getElementById("lVenue").addEventListener("input", () => {
  clearTimeout(venueDebounce);
  const q = document.getElementById("lVenue").value;
  const list = document.getElementById("venueSuggestions");
  if(q.trim().length < 2){ list.classList.remove("open"); return; }
  venueDebounce = setTimeout(async () => {
    renderVenueSuggestions(await searchVenues(q));
  }, 250);
});
document.getElementById("lVenue").addEventListener("blur", () => {
  setTimeout(() => document.getElementById("venueSuggestions").classList.remove("open"), 150);
});
document.getElementById("lVenue").addEventListener("focus", () => {
  const list = document.getElementById("venueSuggestions");
  if(list.innerHTML.trim()) list.classList.add("open");
});

// --- Catalog autocomplete (searches your 84k-song karafun_catalog table) ---
let acDebounce = null;

async function searchCatalog(query){
  if(!query || query.trim().length < 2) return [];
  const term = `*${query.trim()}*`;
  const url = `${SUPABASE_URL}/rest/v1/karafun_catalog?select=title,artist&or=(title.ilike.${encodeURIComponent(term)},artist.ilike.${encodeURIComponent(term)})&limit=8&order=title.asc`;
  try{
    const res = await fetch(url, {headers: HEADERS});
    if(!res.ok) return [];
    return await res.json();
  }catch(e){
    return [];
  }
}

function renderSuggestions(listEl, results, onPick){
  if(results.length === 0){
    listEl.innerHTML = `<div class="autocomplete-empty">No catalog matches</div>`;
  }else{
    listEl.innerHTML = results.map((r, i) => `
      <div class="autocomplete-item" data-idx="${i}">
        <div class="ac-title">${escapeHtml(r.title)}</div>
        <div class="ac-artist">${escapeHtml(r.artist)}</div>
      </div>
    `).join("");
    listEl.querySelectorAll(".autocomplete-item").forEach(el=>{
      el.onclick = () => onPick(results[el.dataset.idx]);
    });
  }
  listEl.classList.add("open");
}

function wireAutocomplete(inputId, listId){
  const input = document.getElementById(inputId);
  const list = document.getElementById(listId);

  input.addEventListener("input", () => {
    clearTimeout(acDebounce);
    const q = input.value;
    if(q.trim().length < 2){ list.classList.remove("open"); return; }
    acDebounce = setTimeout(async () => {
      const results = await searchCatalog(q);
      renderSuggestions(list, results, (picked) => {
        document.getElementById("fTitle").value = picked.title;
        document.getElementById("fArtist").value = picked.artist;
        list.classList.remove("open");
      });
    }, 250);
  });

  input.addEventListener("blur", () => {
    // Delay so a click on a suggestion registers before the list closes
    setTimeout(() => list.classList.remove("open"), 150);
  });
  input.addEventListener("focus", () => {
    if(list.innerHTML.trim()) list.classList.add("open");
  });
}

wireAutocomplete("fTitle", "titleSuggestions");
wireAutocomplete("fArtist", "artistSuggestions");
const THEMES = [
  {id:"jukebox", name:"Neon Jukebox", tag:"Default", colors:["#e8b74e","#3ddad7","#1c1420","#f2e9dc"]},
  {id:"rust", name:"Rust & Rye", tag:"Warm/Americana", colors:["#c9722f","#7fa66b","#1a1512","#f0e6d6"]},
  {id:"cassette", name:"Cassette Blue", tag:"New wave", colors:["#ff5da2","#4fd3ff","#141a2e","#eef1fb"]},
  {id:"contrast", name:"High Contrast", tag:"Max legibility", colors:["#ffe600","#00e5ff","#000000","#ffffff"]}
];

function applyTheme(themeId){
  document.body.dataset.theme = themeId;
  try{ localStorage.setItem("songbook-theme", themeId); }catch(e){}
}

function loadTheme(){
  let saved = "jukebox";
  try{ saved = localStorage.getItem("songbook-theme") || "jukebox"; }catch(e){}
  applyTheme(saved);
}

function renderThemeGrid(){
  const grid = document.getElementById("themeGrid");
  const current = document.body.dataset.theme || "jukebox";
  grid.innerHTML = THEMES.map(t => `
    <button class="theme-option ${t.id===current?"active":""}" data-theme-id="${t.id}">
      <span class="theme-swatch">
        ${t.colors.map(c=>`<span style="background:${c}"></span>`).join("")}
      </span>
      <span>
        <span class="theme-name">${t.name}</span>
        <span class="theme-tag">${t.tag}</span>
      </span>
    </button>
  `).join("");
  grid.querySelectorAll(".theme-option").forEach(btn=>{
    btn.onclick = () => { applyTheme(btn.dataset.themeId); renderThemeGrid(); };
  });
}

const settingsSheet = document.getElementById("settingsSheet");
const settingsBackdrop = document.getElementById("settingsBackdrop");

document.getElementById("settingsBtn").onclick = () => {
  renderThemeGrid();
  document.getElementById("missingResults").innerHTML = "";
  settingsBackdrop.classList.add("open");
  settingsSheet.classList.add("open");
};
function closeSettings(){
  settingsBackdrop.classList.remove("open");
  settingsSheet.classList.remove("open");
}
document.getElementById("btnSettingsClose").onclick = closeSettings;
settingsBackdrop.onclick = closeSettings;

document.getElementById("checkMissingBtn").onclick = async () => {
  const btn = document.getElementById("checkMissingBtn");
  const resultsEl = document.getElementById("missingResults");
  btn.textContent = "Checking…";
  btn.disabled = true;

  try{
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/songs?select=id,title,artist&or=(low_note.is.null,high_note.is.null)&order=artist.asc`,
      {headers: HEADERS}
    );
    if(!res.ok) throw new Error("Lookup failed");
    const missing = await res.json();

    if(missing.length === 0){
      resultsEl.innerHTML = `<div class="missing-none">✓ Every song has range data</div>`;
    }else{
      resultsEl.innerHTML = `
        <div class="missing-summary">${missing.length} song${missing.length===1?"":"s"} missing range data:</div>
        ${missing.map(s => `
          <div class="missing-item" data-id="${s.id}">
            <div class="mi-title">${escapeHtml(s.title)}</div>
            <div class="mi-artist">${escapeHtml(s.artist)}</div>
          </div>
        `).join("")}
        <div class="missing-hint">Tap a song to edit it directly, or ask Claude to "check missing ranges" in chat and it'll research and fill these in.</div>
      `;
      resultsEl.querySelectorAll(".missing-item").forEach(el => {
        el.onclick = () => {
          closeSettings();
          openEdit(el.dataset.id);
        };
      });
    }
  }catch(err){
    resultsEl.innerHTML = `<div class="missing-summary">Error checking: ${err.message}</div>`;
  }finally{
    btn.textContent = "Check for missing range data";
    btn.disabled = false;
  }
};

loadTheme();
fetchSongs();
</script>
